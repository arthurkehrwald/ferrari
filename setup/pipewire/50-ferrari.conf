# Ferrari: Audio-Routing. Wird von setup.sh nach /etc/pipewire/pipewire.conf.d/ kopiert.
#
# Zwei virtuelle Sinks, einer pro Lautstärkeregler. Programme spielen auf einen davon
# (PULSE_SINK=ferrari-music bzw. ferrari-effects), die Lautstärke wird am Sink gesetzt.
# Beide leiten auf den Standard-Ausgang weiter (den DAC). Wird der DAC ab- und wieder
# angesteckt, verbindet WirePlumber die Weiterleitung von selbst neu.
#
# Die Sinks laufen dauerhaft (node.always-process). Sonst würde PipeWire sie in den
# Ruhezustand schicken, und im Ruhezustand werden Lautstärkeänderungen verworfen.
# Nebeneffekt: Der DAC bleibt wach, kein Knacken oder Aufwachen beim ersten Ton.

context.properties = {
    # Feste Rate ohne Umschalten (CD wird von 44,1 kHz umgerechnet), kleine Puffer für
    # einen direkt reagierenden Motorsound (256 / 48000 = 5,3 ms).
    default.clock.rate        = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum     = 256
    default.clock.min-quantum = 128
}

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Ferrari Musik"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "ferrari-music"
                media.class = "Audio/Sink"
                # Niedrige Priorität: Standard-Ausgang soll der DAC bleiben
                priority.session = 1
                priority.driver = 1
                node.always-process = true
            }
            playback.props = {
                node.name = "ferrari-music.output"
                node.description = "Ferrari Musik (Ausgang)"
            }
        }
    }
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Ferrari Effekte"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "ferrari-effects"
                media.class = "Audio/Sink"
                priority.session = 1
                priority.driver = 1
                node.always-process = true
            }
            playback.props = {
                node.name = "ferrari-effects.output"
                node.description = "Ferrari Effekte (Ausgang)"
            }
        }
    }
]
