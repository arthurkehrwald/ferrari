# Ferrari: Wird von setup.sh nach /etc/wireplumber/wireplumber.conf.d/ kopiert.
#
# HDMI-Audio abschalten, sonst landet Ton auf dem Röhrenfernseher (HDMI-HF-Adapter)
# und PipeWire wählt HDMI als Standard-Ausgang, solange der DAC fehlt.
monitor.alsa.rules = [
    {   matches = [ { device.name = "~alsa_card.platform-*.hdmi" } ]
        actions = { update-props = { device.disabled = true } }
    }
]
